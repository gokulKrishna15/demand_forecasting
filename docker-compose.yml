version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8003:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATA_SOURCE=${DATA_SOURCE:-local}

  frontend:
    build:
      context: .
      dockerfile: frontend_react/Dockerfile
    ports:
      - "3000:80"
